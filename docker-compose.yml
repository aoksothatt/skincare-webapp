services:
  postgres:
    image: postgres:16-alpine
    container_name: thatskin_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-skincare_db}"
      POSTGRES_USER: "${DB_USERNAME:-skincare_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-skincare_secret}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-skincare_user} -d ${DB_DATABASE:-skincare_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: thatskin_postgres_data
